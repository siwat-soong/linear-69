<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Body Reshaping</title>
<style>
:root{
  --bg:#F8E7C2; --surface:#FFF9F1; --surface2:#FDF2E2;
  --orange:#F2A65A; --orangeDark:#E58A35;
  --brown:#5C3A21; --brown2:#8B6246; --line:#DDBE98;
  --muted:#A78E79; --disabled:#D9D3CC; --disabledText:#9A958E;
  --shadow:0 14px 40px rgba(92,58,33,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; padding:24px; overflow:hidden;
  font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;
  background:var(--bg); color:var(--brown);
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit}

/* ===== Layout (desktop) : ทั้งหน้าพอดีจอ ไม่ต้องเลื่อน ===== */
.app{
  height:100%; max-width:1480px; margin:auto;
  display:grid; grid-template-columns:88px minmax(0,1fr) 260px;
  grid-template-rows:auto minmax(0,1fr);
  gap:18px;
}
.topbar{
  grid-column:1/-1; display:flex; justify-content:space-between;
  align-items:center; gap:16px; padding:4px;
}
.brand h1{margin:0;font-size:clamp(22px,2.2vw,34px);letter-spacing:-.03em}
.top-logo{display:none}
.history{display:flex;gap:8px}
.icon-btn{
  width:42px;height:42px;border:0;border-radius:50%;
  background:rgba(255,249,241,.7);color:var(--brown);
  cursor:pointer;transition:.18s ease;
}
.icon-btn:hover:not(:disabled){background:var(--surface);transform:translateY(-1px)}
.icon-btn:active:not(:disabled){transform:scale(.96);background:#F5D8B3}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}

.tool-rail,.panel{background:var(--surface);border-radius:28px;box-shadow:var(--shadow)}

/* ===== Tools : แสดงครบทุกปุ่ม ปุ่มจะยืด/หดตามความสูงจอ ===== */
.tool-rail{
  padding:12px 8px; min-height:0;
  display:flex; flex-direction:column;
}
.tool-title{text-align:center;font-size:11px;color:var(--muted);margin:2px 0 8px}
.tools{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.tool{
  flex:1 1 0; min-height:0; max-height:68px; width:100%;
  border:0;border-radius:16px;
  background:transparent;color:var(--brown2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;transition:.18s ease;
}
.tool svg{
  width:26px;height:26px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
.tool span{font-size:10px;line-height:1}
.tool:hover:not(:disabled){background:var(--surface2);color:var(--brown)}
.tool.active{background:var(--orange);color:var(--brown)}
.tool:active:not(:disabled){transform:scale(.96)}
.tool:disabled{opacity:.35;cursor:not-allowed}

/* ===== Canvas : ขนาด = min(กว้างที่มี, สูงที่มี, 640) จึงเห็นภาพเต็มเสมอ ===== */
.workspace{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px}
.stage{flex:1;min-height:0;width:100%;container-type:size;display:grid;place-items:center}
.canvas-shell{
  position:relative; width:min(100cqw,100cqh,640px); aspect-ratio:1;
  background:var(--surface);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;
}
#canvas{width:100%;height:100%;display:block;background:#FFFDF9}
.drop-overlay{
  position:absolute;inset:14px;border:1.5px dashed var(--line);
  border-radius:20px;display:grid;place-items:center;text-align:center;
}
.drop-content{padding:20px;max-width:360px}
.upload-mark{
  width:64px;height:64px;border-radius:22px;margin:0 auto 14px;
  display:grid;place-items:center;background:#FFE1B6;color:var(--brown);
}
.upload-mark svg{width:34px;height:34px;fill:currentColor}
.drop-content h2{margin:0;font-size:20px}
.drop-content p{margin:8px 0 16px;font-size:13px;color:var(--muted)}
.btn{
  border:0;min-height:44px;border-radius:999px;padding:0 22px;
  font-weight:700;cursor:pointer;transition:.18s ease;
}
.btn-primary{background:var(--orange);color:var(--brown)}
.btn-primary:hover:not(:disabled){background:var(--orangeDark);color:white;transform:translateY(-1px)}
.btn-primary:active:not(:disabled){transform:scale(.98);background:#D8792B}
.btn-secondary{background:var(--surface2);color:var(--brown)}
.btn-secondary:hover:not(:disabled){background:#F7E2C8}
.btn:disabled{background:var(--disabled);color:var(--disabledText);cursor:not-allowed}
.dragging .drop-overlay{background:rgba(242,166,90,.12);border-color:var(--orangeDark)}
.dragging{outline:3px dashed var(--orangeDark);outline-offset:-3px}
.loaded .drop-overlay{display:none}
.preview-hint{
  flex:none;border:0;background:rgba(92,58,33,.18);color:var(--brown);
  padding:7px 14px;border-radius:999px;font-size:11px;cursor:pointer;
  user-select:none;-webkit-user-select:none;touch-action:none;
}
.preview-hint:disabled{opacity:.35;cursor:not-allowed}
.preview-hint.active{background:var(--brown);color:#FFF8ED}

/* ===== Panel ===== */
.panel{padding:18px;align-self:start;max-height:100%;overflow:auto}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.panel h3{margin:0;font-size:15px}
.selected-tool{
  font-size:11px;color:var(--brown2);background:var(--surface2);
  padding:5px 9px;border-radius:999px;
}
.control-label{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;font-size:12px;font-weight:700;
}
.value-pill{
  min-width:46px;text-align:center;padding:5px 8px;border-radius:999px;
  background:#FFE4BF;color:var(--brown);
}
input[type=range]{
  width:100%;appearance:none;-webkit-appearance:none;height:5px;border-radius:999px;
  background:linear-gradient(to right,var(--orangeDark) 0 50%,#DDD7D0 50% 100%);
  outline:none;touch-action:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--brown);cursor:pointer;box-shadow:0 2px 8px rgba(92,58,33,.20);
}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border:0;border-radius:50%;background:var(--brown);cursor:pointer;
}
input[type=range]:disabled{opacity:.35}
.scale-values{margin-top:6px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}
.divider{height:1px;background:#EEE2D4;margin:20px 0}
.panel-actions{display:grid;gap:10px}
.note{margin-top:18px;font-size:10px;line-height:1.55;color:var(--muted)}
.project-name{margin:22px 0 0;padding-top:14px;border-top:1px solid #EEE2D4;font-size:11px;line-height:1.5;color:var(--muted);text-align:center}

/* ===== Mobile : layout แบบ Meitu (หัว / ภาพ / slider / แถบ tools ล่าง) ไม่เลื่อนหน้า ===== */
@media(max-width:820px){
  body{padding:0}
  .app{
    display:flex;flex-direction:column;gap:8px;max-width:none;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .topbar{padding:0;flex:none}
  .brand{display:none}
  .top-logo{display:block;min-width:0}
  .top-logo strong{display:block;font-size:12px;line-height:1.3;color:var(--brown2)}
  .top-logo small{display:block;font-size:9px;color:var(--muted)}
  .icon-btn{width:38px;height:38px}

  .workspace{order:1;flex:1;gap:6px}
  .topbar{order:0}
  .panel{order:2}
  .tool-rail{order:3}

  .canvas-shell{border-radius:18px}
  .drop-overlay{inset:10px}
  .drop-content h2{font-size:17px}
  .upload-mark{width:54px;height:54px;margin-bottom:10px}

  .panel{
    flex:none;padding:10px 12px;border-radius:20px;overflow:visible;
    display:grid;grid-template-columns:auto 1fr auto;column-gap:10px;row-gap:10px;align-items:center;
  }
  .panel-head,.control-label{display:contents}
  .panel h3,.control-label>span:first-child,.scale-values,.divider,.note,.project-name{display:none}
  .selected-tool{grid-column:1;min-width:54px;text-align:center;padding:6px 10px;font-size:12px}
  #scaleRange{grid-column:2}
  .value-pill{grid-column:3;min-width:42px;padding:5px 6px}
  .panel-actions{grid-column:1/-1;grid-template-columns:repeat(3,1fr);gap:8px}
  .panel-actions .btn{min-height:38px;padding:0 6px;font-size:12.5px;white-space:nowrap}

  .tool-rail{flex:none;padding:6px 4px;border-radius:20px}
  .tool-title{display:none}
  .tools{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;flex:none}
  .tool{height:54px;max-height:none;border-radius:12px;gap:4px}
  .tool svg{width:23px;height:23px}
  .tool span{font-size:9px}
}
</style>
</head>

<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><h1>Body Reshaping</h1></div>
    <div class="top-logo"><strong>ไม่ยากถ้าอยากผอม</strong><small>Mai Yak Tha Yak Phom</small></div>
    <div class="history">
      <button id="undoBtn" class="icon-btn" aria-label="Undo" disabled>↶</button>
      <button id="redoBtn" class="icon-btn" aria-label="Redo" disabled>↷</button>
    </div>
  </header>

  <aside class="tool-rail">
    <div class="tool-title">TOOLS</div>
    <!-- ปุ่มเครื่องมือถูกสร้างจาก ICONS ใน <script> ด้านล่าง -->
    <div class="tools" id="tools"></div>
  </aside>

  <section class="workspace">
    <div class="stage">
      <div class="canvas-shell" id="dropZone">
        <canvas id="canvas" width="640" height="640"></canvas>
        <div class="drop-overlay">
          <div class="drop-content">
            <div class="upload-mark">
              <svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 5.5 8.5 5.99 5.99 0 0 0 6 20h13a5 5 0 0 0 .35-9.96ZM13 13v4h-2v-4H8l4-4 4 4h-3Z"/></svg>
            </div>
            <h2>Drop Your Image Here</h2>
            <p>ลากภาพมาวาง หรือเลือกรูปจากเครื่อง</p>
            <button class="btn btn-primary" id="chooseBtn">Choose Image</button>
          </div>
        </div>
      </div>
    </div>
    <button id="previewBtn" class="preview-hint" disabled>Hold to preview original</button>
  </section>

  <aside class="panel">
    <div class="panel-head">
      <h3>Reshape</h3>
      <span class="selected-tool" id="selectedTool">Brow</span>
    </div>

    <div class="control-label">
      <span>Scale</span>
      <span class="value-pill" id="scaleValue">0</span>
    </div>

    <input id="scaleRange" type="range" min="-50" max="50" value="0" disabled>
    <div class="scale-values"><span>-50</span><span>0</span><span>50</span></div>

    <div class="divider"></div>

    <div class="panel-actions">
      <button id="changeBtn" class="btn btn-secondary" disabled>Change Image</button>
      <button id="resetBtn" class="btn btn-secondary" disabled>Reset</button>
      <button id="downloadBtn" class="btn btn-primary" disabled>Download</button>
    </div>

    <p class="note">
      เลือกบริเวณที่ต้องการปรับ แล้วเลื่อน Scale ไปทางขวาเพื่อบีบให้เล็กลง
      หรือทางซ้ายเพื่อขยาย
    </p>

    <p class="project-name">ไม่ยากถ้าอยากผอม (Mai Yak Tha Yak Phom)</p>
  </aside>

  <input id="fileInput" type="file" accept="image/*" hidden>
</main>

   - key (brow, eye, ...) = ชื่อเครื่องมือที่ใช้ในโค้ด reshape
   - label = ข้อความใต้ไอคอน
   - viewBox = (ไม่ใส่ก็ได้) ขนาดกริดของไอคอน ค่าเริ่มต้น '0 0 32 32'

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const fileInput = document.getElementById('fileInput');
const chooseBtn = document.getElementById('chooseBtn');
const changeBtn = document.getElementById('changeBtn');
const dropZone = document.getElementById('dropZone');
const scaleRange = document.getElementById('scaleRange');
const scaleValue = document.getElementById('scaleValue');
const selectedTool = document.getElementById('selectedTool');
const downloadBtn = document.getElementById('downloadBtn');
const resetBtn = document.getElementById('resetBtn');
const previewBtn = document.getElementById('previewBtn');
const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');
const toolsEl = document.getElementById('tools');

let sourceImage = null;
let originalFrame = null;
let activeTool = Object.keys(ICONS)[0];

const reshapeState = {};
Object.keys(ICONS).forEach(key => reshapeState[key] = 0);

/* สร้างปุ่มเครื่องมือจาก ICONS */
Object.entries(ICONS).forEach(([key, item], i) => {
  const btn = document.createElement('button');
  btn.className = 'tool' + (i === 0 ? ' active' : '');
  btn.dataset.tool = key;
  btn.dataset.label = item.label;
  btn.disabled = true;
  btn.innerHTML = `<svg viewBox="${item.viewBox || '0 0 32 32'}">${item.svg}</svg><span>${item.label}</span>`;
  toolsEl.appendChild(btn);
});
const toolButtons = [...document.querySelectorAll('.tool')];
selectedTool.textContent = ICONS[activeTool].label;

function setEditorEnabled(enabled){
  toolButtons.forEach(btn => btn.disabled = !enabled);
  scaleRange.disabled = !enabled;
  downloadBtn.disabled = !enabled;
  resetBtn.disabled = !enabled;
  changeBtn.disabled = !enabled;
  previewBtn.disabled = !enabled;
}

function updateRangeFill(){
  const min = Number(scaleRange.min);
  const max = Number(scaleRange.max);
  const value = Number(scaleRange.value);
  const percent = ((value-min)/(max-min))*100;
  scaleRange.style.background =
    `linear-gradient(to right,
      var(--orangeDark) 0%,
      var(--orangeDark) ${percent}%,
      #DDD7D0 ${percent}%,
      #DDD7D0 100%)`;
}

function drawImageCover(img){
  const cw = canvas.width;
  const ch = canvas.height;
  const scale = Math.max(cw/img.width, ch/img.height);
  const w = img.width * scale;
  const h = img.height * scale;
  const x = (cw-w)/2;
  const y = (ch-h)/2;

  ctx.clearRect(0,0,cw,ch);
  ctx.drawImage(img,x,y,w,h);
  originalFrame = ctx.getImageData(0,0,cw,ch);
}

function resetControls(){
  Object.keys(reshapeState).forEach(key => reshapeState[key] = 0);
  scaleRange.value = 0;
  scaleValue.textContent = '0';
  updateRangeFill();
}

/* โหลดรูป — ใช้ทั้งตอนเลือกรูปครั้งแรก และตอนเปลี่ยนรูป */
function loadFile(file){
  if(!file || !file.type.startsWith('image/')) return;

  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      sourceImage = img;
      drawImageCover(img);
      dropZone.classList.add('loaded');
      setEditorEnabled(true);
      resetControls();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

chooseBtn.addEventListener('click', () => fileInput.click());
changeBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  loadFile(e.target.files[0]);
  fileInput.value = '';   // เลือกไฟล์เดิมซ้ำได้
});

['dragenter','dragover'].forEach(type => {
  dropZone.addEventListener(type, e => {
    e.preventDefault();
    dropZone.classList.add('dragging');
  });
});
['dragleave','drop'].forEach(type => {
  dropZone.addEventListener(type, e => {
    e.preventDefault();
    dropZone.classList.remove('dragging');
  });
});
/* ลากรูปใหม่มาวางทับบนภาพก็เปลี่ยนรูปได้ */
dropZone.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

toolButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    toolButtons.forEach(item => item.classList.remove('active'));
    btn.classList.add('active');

    activeTool = btn.dataset.tool;
    selectedTool.textContent = btn.dataset.label;

    scaleRange.value = reshapeState[activeTool] ?? 0;
    scaleValue.textContent = scaleRange.value > 0 ? `+${scaleRange.value}` : scaleRange.value;
    updateRangeFill();
  });
});

scaleRange.addEventListener('input', () => {
  const value = Number(scaleRange.value);
  scaleValue.textContent = value > 0 ? `+${value}` : value;
  reshapeState[activeTool] = value;
  updateRangeFill();

  /*
    จุดเชื่อมกับ mask/reshape จริง:
    applyReshape({
      canvas,
      sourceImage,
      part: activeTool,   // brow | eye | nose | mouth | chest | waist | butt | arm | leg
      amount: value
    });
  */
});

resetBtn.addEventListener('click', () => {
  if(!sourceImage) return;
  resetControls();
  drawImageCover(sourceImage);
});

function showOriginal(){
  if(!originalFrame) return;
  ctx.putImageData(originalFrame,0,0);
  previewBtn.classList.add('active');
  previewBtn.textContent = 'Original';
}

function stopPreview(){
  previewBtn.classList.remove('active');
  previewBtn.textContent = 'Hold to preview original';
  // หลังต่อ reshape engine ให้ redraw ภาพที่แก้แล้วตรงนี้
}

previewBtn.addEventListener('pointerdown', showOriginal);
previewBtn.addEventListener('pointerup', stopPreview);
previewBtn.addEventListener('pointerleave', stopPreview);
previewBtn.addEventListener('pointercancel', stopPreview);

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  showOriginal();
  setTimeout(stopPreview,700);
});

downloadBtn.addEventListener('click', () => {
  if(!sourceImage) return;
  const link = document.createElement('a');
  link.download = 'body-reshape-640x640.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

undoBtn.addEventListener('click', () => {});
redoBtn.addEventListener('click', () => {});

setEditorEnabled(false);
updateRangeFill();
</script>
</body>
</html>
